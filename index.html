<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Bee Runner (Portrait)</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #071026;
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .hud {
            position: fixed;
            left: 12px;
            top: 10px;
            color: #eaf0ff;
            font: 14px/1.2 system-ui, Segoe UI, Roboto, Arial, sans-serif;
            text-shadow: 0 2px 10px rgba(0, 0, 0, .5);
            user-select: none;
            -webkit-user-select: none;
        }

        .hud b {
            font-size: 18px
        }

        .topBtns {
            position: fixed;
            right: 10px;
            top: 10px;
            display: flex;
            gap: 8px;
            z-index: 5;
            user-select: none;
            -webkit-user-select: none;
        }

        .chip {
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .12);
            color: #eaf0ff;
            font: 14px system-ui, Segoe UI, Roboto, Arial, sans-serif;
        }

        .controls {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            gap: 12px;
            padding: 14px;
            z-index: 5;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn {
            flex: 1;
            height: 78px;
            border-radius: 18px;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .14);
            color: #eaf0ff;
            font: 600 20px system-ui, Segoe UI, Roboto, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            background: rgba(255, 255, 255, .14);
        }

        .center {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px;
            z-index: 10;
            background: radial-gradient(circle at 50% 25%, rgba(255, 214, 0, .14), transparent 55%);
            color: #eaf0ff;
            font-family: system-ui, Segoe UI, Roboto, Arial, sans-serif;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
        }

        .card {
            max-width: 520px;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 18px;
            padding: 18px 18px 14px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .35);
        }

        .card h1 {
            margin: 0 0 8px;
            font-size: 22px
        }

        .card p {
            margin: 8px 0;
            opacity: .9
        }

        .hint {
            opacity: .75;
            font-size: 13px
        }

        .start {
            margin-top: 12px;
            display: inline-block;
            padding: 10px 14px;
            border-radius: 14px;
            background: rgba(255, 214, 0, .18);
            border: 1px solid rgba(255, 214, 0, .35);
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>

    <div class="hud">
        <div style="opacity:.75;margin-top:6px"><span id="dbg"></span></div>
        <div>Score: <b id="score">0</b></div>
        <div>Best: <span id="best">0</span></div>
        <div>HP: <span id="hp">❤️❤️❤️</span></div>
        <div style="opacity:.8;margin-top:6px">Fly forward • Flowers 🌸 +1 • Avoid hornets 🐝❌</div>
    </div>

    <div class="topBtns">
        <div class="chip"
            id="tiltBtn">🎛️ Tilt: OFF</div>
        <div class="chip"
            id="muteBtn">🔊</div>
    </div>

    <div class="controls">
        <div class="btn"
            id="leftBtn">◀︎</div>
        <div class="btn"
            id="rightBtn">▶︎</div>
    </div>

    <div class="center"
        id="overlay">
        <div class="card">
            <h1>🐝 Bee Runner</h1>
            <p>Portrait endless flight. Hold <b>◀︎ / ▶︎</b> or tilt your phone to steer.</p>
            <p class="hint">Tip: tap “Tilt: OFF” to enable tilt (may ask permission on iPhone).</p>
            <div class="start">Tap to start</div>
        </div>
    </div>

    <script>
        (() => {
            // ---------- Canvas ----------
            const canvas = document.getElementById('c');
            const ctx = canvas.getContext('2d');
            let W = 0, H = 0, DPR = 1;
            function resize() {
                DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
                W = Math.floor(innerWidth);
                H = Math.floor(innerHeight);
                canvas.width = Math.floor(W * DPR);
                canvas.height = Math.floor(H * DPR);
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            }
            addEventListener('resize', resize, { passive: true });
            resize();

            // ---------- UI ----------
            const overlay = document.getElementById('overlay');
            const scoreEl = document.getElementById('score');
            const bestEl = document.getElementById('best');
            const leftBtn = document.getElementById('leftBtn');
            const rightBtn = document.getElementById('rightBtn');
            const tiltBtn = document.getElementById('tiltBtn');
            const muteBtn = document.getElementById('muteBtn');
            const hpEl = document.getElementById('hp');
            const dbgEl = document.getElementById('dbg');
            dbgEl.textContent += `Version: 6`;

            const BEST_KEY = "bee_runner_best_v1";
            let best = Number(localStorage.getItem(BEST_KEY) || 0);
            bestEl.textContent = best;
            const MAX_HP = 3;
            let hp = MAX_HP;
            let invuln = 0; // seconds remaining
            // ---------- Helpers ----------
            const rnd = (a, b) => a + Math.random() * (b - a);
            const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
            const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };

            // ---------- Sound (tiny beeps) ----------
            let audioCtx = null;
            let muted = false;
            function beep(freq = 660, dur = 0.05, type = 'sine', vol = 0.06) {
                if (muted) return;
                try {
                    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const t0 = audioCtx.currentTime;
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = type;
                    o.frequency.setValueAtTime(freq, t0);
                    g.gain.setValueAtTime(0, t0);
                    g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
                    g.gain.linearRampToValueAtTime(0, t0 + dur);
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(t0); o.stop(t0 + dur + 0.02);
                } catch (e) { }
            }
            muteBtn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                muted = !muted;
                muteBtn.textContent = muted ? "🔇" : "🔊";
                if (!muted) beep(880, 0.04, 'triangle', 0.05);
            }, { passive: false });

            // ---------- Control state ----------
            let holdLeft = false, holdRight = false;
            function renderHP() {
                hpEl.textContent = "❤️".repeat(hp) + "🖤".repeat(Math.max(0, MAX_HP - hp));
            }
            function bindHold(el, onDown, onUp) {
                el.addEventListener('pointerdown', (e) => { e.preventDefault(); el.setPointerCapture(e.pointerId); onDown(); }, { passive: false });
                el.addEventListener('pointerup', (e) => { e.preventDefault(); onUp(); }, { passive: false });
                el.addEventListener('pointercancel', (e) => { e.preventDefault(); onUp(); }, { passive: false });
                el.addEventListener('pointerleave', (e) => { /* ignore */ }, { passive: true });
            }
            bindHold(leftBtn, () => holdLeft = true, () => holdLeft = false);
            bindHold(rightBtn, () => holdRight = true, () => holdRight = false);

            // Keyboard for desktop
            addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a') holdLeft = true;
                if (e.key === 'ArrowRight' || e.key === 'd') holdRight = true;
            });
            addEventListener('keyup', (e) => {
                if (e.key === 'ArrowLeft' || e.key === 'a') holdLeft = false;
                if (e.key === 'ArrowRight' || e.key === 'd') holdRight = false;
            });

            // Tilt control
            let tiltEnabled = false;
            let tiltX = 0;

            function setTiltEnabled(v) {
                tiltEnabled = v;
                tiltBtn.textContent = tiltEnabled ? "🎛️ Tilt: ON" : "🎛️ Tilt: OFF";
            }

            async function requestMotionPermissionIfNeeded() {
                // iOS 13+ needs permission for both orientation and motion
                const need = (ev) => ev && typeof ev.requestPermission === "function";

                if (need(window.DeviceOrientationEvent)) {
                    const r = await window.DeviceOrientationEvent.requestPermission().catch(() => "denied");
                    if (r !== "granted") return false;
                }
                if (need(window.DeviceMotionEvent)) {
                    const r = await window.DeviceMotionEvent.requestPermission().catch(() => "denied");
                    if (r !== "granted") return false;
                }
                return true;
            }

            tiltBtn.addEventListener('pointerdown', async (e) => {
                e.preventDefault();
                if (!tiltEnabled) {
                    const ok = await requestMotionPermissionIfNeeded();
                    if (!ok) {
                        setTiltEnabled(false);
                        return;
                    }
                    setTiltEnabled(true);
                } else {
                    setTiltEnabled(false);
                }
            }, { passive: false });

            // Primary: DeviceOrientation (gamma left/right)
            // Primary: DeviceOrientation (gamma left/right)
            let lastGamma = 0;
            let tiltSign = -1; // set to -1 if you want inverted

            addEventListener('deviceorientation', (e) => {
                if (!tiltEnabled) return;
                if (typeof e.gamma !== 'number') return;

                lastGamma = e.gamma;
                if (neutralGamma === null) return;

                const raw = (e.gamma - neutralGamma) * tiltSign; // <-- only place to invert
                const dead = 3;
                const g = Math.abs(raw) < dead ? 0 : raw;

                tiltX = clamp(g / 25, -1, 1);
            }, { passive: true });

            // Fallback: DeviceMotion (acceleration incl gravity)
            addEventListener('devicemotion', (e) => {
                if (!tiltEnabled) return;
                const a = e.accelerationIncludingGravity;
                if (!a) return;

                const ax = (typeof a.x === 'number') ? a.x : 0;

                const dead = 0.4;
                const raw = ax * tiltSign;
                const v = Math.abs(raw) < dead ? 0 : raw;

                tiltX = clamp(v / 4.5, -1, 1);
            }, { passive: true });
            dbgEl.textContent += String(`Tilt X: ${tiltX}`);

            // ---------- Game state ----------
            let running = false;
            let t = 0;
            let score = 0;
            let speed = 260;     // world scroll speed (px/s)
            let difficulty = 0;  // increases over time

            const bee = {
                x: 0, y: 0,
                r: 18,
                vx: 0,
            };

            const flowers = [];
            const hornets = [];
            const pollen = []; // background particles

            // Spawn in world coordinates: y increases downward; we move items down screen by adding speed*dt.
            function reset() {
                t = 0; score = 0; difficulty = 0;
                speed = 260;
                bee.x = W * 0.5; bee.y = H * 0.72; bee.vx = 0;
                flowers.length = 0; hornets.length = 0; pollen.length = 0;
                scoreEl.textContent = "0";
                // seed pollen
                for (let i = 0;i < 80;i++) {
                    pollen.push({ x: rnd(0, W), y: rnd(0, H), s: rnd(0.5, 2.0) });
                }
                hp = MAX_HP;
                invuln = 0;
                renderHP();
            }

            function startGame() {
                overlay.style.display = 'none';
                running = true;
                reset();
                // initial spawns
                for (let i = 0;i < 4;i++) spawnFlower(true);
                for (let i = 0;i < 1;i++) spawnHornet(true);
                beep(660, 0.05, 'sine', 0.06);
            }

            function endGame() {
                running = false;
                overlay.style.display = 'flex';
                best = Math.max(best, score);
                localStorage.setItem(BEST_KEY, String(best));
                bestEl.textContent = best;
                beep(180, 0.10, 'sawtooth', 0.05);
                beep(120, 0.12, 'sawtooth', 0.05);
            }

            overlay.addEventListener('pointerdown', (e) => { e.preventDefault(); startGame(); }, { passive: false });
            canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); if (!running) startGame(); }, { passive: false });

            function spawnFlower(initial = false) {
                flowers.push({
                    x: rnd(30, W - 30),
                    y: initial ? rnd(-H, 0) : -40,
                    r: 14,
                    rot: rnd(0, Math.PI * 2),
                    spin: rnd(-2, 2),
                });
            }
            function spawnHornet(initial = false) {
                hornets.push({
                    x: rnd(30, W - 30),
                    y: initial ? rnd(-H * 1.2, -80) : -80,
                    r: 20,
                    drift: rnd(-60, 60),
                    phase: rnd(0, Math.PI * 2),
                    wiggle: rnd(1.2, 2.2),
                });
            }

            // ---------- Drawing ----------
            function drawBackground(dt) {
                // --- base grass gradient (top-down) ---
                const g = ctx.createLinearGradient(0, 0, 0, H);
                g.addColorStop(0, "#2f8f3b");
                g.addColorStop(1, "#1f6f30");
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, W, H);

                // --- a reusable "scroll" helper for repeating y ---
                const wrapY = (yy, span, top = 0) => ((yy - top) % span + span) % span + top;

                // --- mottled grass cells (gives texture without heavy per-pixel noise) ---
                // We use deterministic pseudo positions so it doesn't flicker.
                ctx.save();
                ctx.globalAlpha = 0.18;

                const cellSpan = 60;               // how often pattern repeats vertically
                const scroll = (t * speed * 0.22); // background scroll amount

                for (let i = 0;i < 220;i++) {
                    const x = (i * 67) % W;
                    const base = (i * 97) % (H + cellSpan);
                    const y = wrapY(base + scroll, H + cellSpan, -cellSpan);

                    const s = 18 + (i % 9) * 3;
                    // alternate slightly different greens
                    ctx.fillStyle = (i % 3 === 0)
                        ? "rgba(0,0,0,0.25)"       // shadow clump
                        : (i % 3 === 1)
                            ? "rgba(255,255,255,0.10)" // sunlit clump
                            : "rgba(0,0,0,0.15)";

                    ctx.beginPath();
                    ctx.ellipse(x, y, s * 1.3, s, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                // --- mowing / direction streaks (parallax lines) ---
                ctx.save();
                const streakScroll = (t * speed * 0.35) % 40;
                ctx.globalAlpha = 0.10;
                ctx.lineWidth = 2;

                for (let x = -40;x < W + 40;x += 46) {
                    ctx.strokeStyle = "rgba(255,255,255,0.22)";
                    ctx.beginPath();
                    ctx.moveTo(x + 8, -80 + streakScroll);
                    ctx.lineTo(x - 18, H + 80 + streakScroll);
                    ctx.stroke();

                    ctx.strokeStyle = "rgba(0,0,0,0.22)";
                    ctx.beginPath();
                    ctx.moveTo(x + 20, -80 + streakScroll);
                    ctx.lineTo(x - 6, H + 80 + streakScroll);
                    ctx.stroke();
                }
                ctx.restore();

                // --- dirt patches / worn paths (rare) ---
                ctx.save();
                ctx.globalAlpha = 0.18;
                const dirtScroll = (t * speed * 0.18);
                for (let i = 0;i < 14;i++) {
                    const x = (i * 173 + 90) % W;
                    const base = (i * 211) % (H + 240);
                    const y = wrapY(base + dirtScroll, H + 240, -240);

                    const rx = 30 + (i % 5) * 10;
                    const ry = 18 + (i % 4) * 8;

                    const dg = ctx.createRadialGradient(x, y, 2, x, y, rx * 1.2);
                    dg.addColorStop(0, "rgba(120,85,40,0.55)");
                    dg.addColorStop(1, "rgba(120,85,40,0)");
                    ctx.fillStyle = dg;

                    ctx.beginPath();
                    ctx.ellipse(x, y, rx, ry, (i % 3) * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                // --- tiny flowers as specks (top-down vibe) ---
                ctx.save();
                ctx.globalAlpha = 0.30;
                const flowerScroll = (t * speed * 0.55);
                for (let i = 0;i < 55;i++) {
                    const x = (i * 79 + 33) % W;
                    const base = (i * 101) % (H + 120);
                    const y = wrapY(base + flowerScroll, H + 120, -120);

                    const s = 2 + (i % 3); // 2..4
                    ctx.fillStyle = (i % 4 === 0) ? "rgba(255,105,180,0.95)"
                        : (i % 4 === 1) ? "rgba(255,214,0,0.95)"
                            : (i % 4 === 2) ? "rgba(180,120,255,0.95)"
                                : "rgba(255,255,255,0.90)";

                    ctx.beginPath();
                    ctx.arc(x, y, s, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                // --- pollen drift (still nice, but subtle) ---
                for (const p of pollen) {
                    p.y += (speed * 0.25) * dt * p.s;
                    p.x += Math.sin(t * 0.8 + p.y * 0.01) * dt * 10 * p.s;

                    if (p.y > H + 10) { p.y = -10; p.x = rnd(0, W); p.s = rnd(0.5, 2.0); }
                    if (p.x < -20) p.x = W + 20;
                    if (p.x > W + 20) p.x = -20;

                    ctx.globalAlpha = 0.14;
                    ctx.fillStyle = "rgba(255,255,255,0.9)";
                    ctx.fillRect(p.x, p.y, 2, 2);
                    ctx.globalAlpha = 1;
                }

                // --- vignette (keeps focus on bee) ---
                ctx.save();
                const v = ctx.createRadialGradient(W * 0.5, H * 0.55, H * 0.15, W * 0.5, H * 0.55, H * 0.95);
                v.addColorStop(0, "rgba(0,0,0,0)");
                v.addColorStop(1, "rgba(0,0,0,0.22)");
                ctx.fillStyle = v;
                ctx.fillRect(0, 0, W, H);
                ctx.restore();
            }

            function drawBeeTopDown() {
                const x = bee.x, y = bee.y, r = bee.r;

                const ellipsePath = (cx, cy, rx, ry, rot = 0) => {
                    ctx.beginPath();
                    ctx.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2);
                };

                // ---------- Soft ground shadow (adds depth) ----------
                ctx.save();
                ctx.globalAlpha = 0.18;
                ctx.fillStyle = "#000";
                ellipsePath(x, y + r * 1.05, r * 0.9, r * 0.35);
                ctx.fill();
                ctx.restore();

                // ---------- Legs (under body) ----------
                ctx.save();
                ctx.strokeStyle = "#2a1a00";
                ctx.lineCap = "round";
                ctx.lineWidth = Math.max(1.4, r * 0.06);

                const thoraxY = y - r * 0.08;
                const legOut = r * 0.62;
                const legBack = r * 0.22;

                for (const side of [-1, 1]) {
                    for (let i = -1;i <= 1;i++) {
                        const ly = thoraxY + i * r * 0.34;
                        const lx = x + side * r * 0.50;

                        // 2-segment leg
                        const kx = lx + side * (legOut * 0.65);
                        const ky = ly + r * (0.20 + 0.07 * i);
                        const fx = kx + side * (legOut * 0.40);
                        const fy = ky + r * (0.18 + 0.06 * i) + legBack * 0.10;

                        ctx.beginPath();
                        ctx.moveTo(lx, ly);
                        ctx.quadraticCurveTo(kx, ky, fx, fy);
                        ctx.stroke();

                        // foot tip
                        ctx.lineWidth = Math.max(1.1, r * 0.045);
                        ctx.beginPath();
                        ctx.moveTo(fx, fy);
                        ctx.lineTo(fx + side * r * 0.16, fy + r * 0.04);
                        ctx.stroke();

                        ctx.lineWidth = Math.max(1.4, r * 0.06);
                    }
                }
                ctx.restore();

                // ---------- Wings (behind body; nicer material + motion) ----------
                ctx.save();
                const flap = Math.sin(t * 18) * 0.22;
                const flap2 = Math.sin(t * 18 + 1.7) * 0.16;

                // Wing "glass" gradient
                const wg = ctx.createRadialGradient(x, y - r * 0.45, r * 0.15, x, y - r * 0.40, r * 1.75);
                wg.addColorStop(0, "rgba(255,255,255,0.90)");
                wg.addColorStop(0.35, "rgba(210,240,255,0.55)");
                wg.addColorStop(1, "rgba(140,200,255,0.18)");

                // Slight blur by drawing 2 layers
                ctx.globalAlpha = 0.75;
                ctx.fillStyle = wg;

                // left wing
                ellipsePath(x - r * 0.92, y - r * 0.30, r * 0.62, r * 1.08, -0.68 + flap);
                ctx.fill();
                // right wing
                ellipsePath(x + r * 0.92, y - r * 0.30, r * 0.62, r * 1.08, 0.68 - flap);
                ctx.fill();

                // second faint layer for "motion"
                ctx.globalAlpha = 0.35;
                ellipsePath(x - r * 0.92, y - r * 0.30, r * 0.62, r * 1.08, -0.68 + flap2);
                ctx.fill();
                ellipsePath(x + r * 0.92, y - r * 0.30, r * 0.62, r * 1.08, 0.68 - flap2);
                ctx.fill();

                // Veins
                ctx.globalAlpha = 0.28;
                ctx.strokeStyle = "rgba(90,140,180,0.9)";
                ctx.lineWidth = Math.max(1, r * 0.03);
                const vein = (sx, sy, ex, ey, lift) => {
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.quadraticCurveTo((sx + ex) / 2, sy - lift, ex, ey);
                    ctx.stroke();
                };
                vein(x - r * 0.60, y - r * 0.70, x - r * 1.16, y + r * 0.10, r * 0.48);
                vein(x + r * 0.60, y - r * 0.70, x + r * 1.16, y + r * 0.10, r * 0.48);

                ctx.restore();

                // ---------- Abdomen (better shading + stripes that wrap) ----------
                ctx.save();

                // base body gradient
                const ag = ctx.createLinearGradient(x, y - r * 0.10, x, y + r * 1.85);
                ag.addColorStop(0, "#fff1a8");
                ag.addColorStop(0.45, "#ffd34f");
                ag.addColorStop(1, "#ff9f1a");

                ellipsePath(x, y + r * 0.52, r * 0.92, r * 1.18);
                ctx.fillStyle = ag;
                ctx.fill();

                // edge shade (vignette on body)
                ctx.globalAlpha = 0.22;
                const edge = ctx.createRadialGradient(x, y + r * 0.60, r * 0.2, x, y + r * 0.65, r * 1.35);
                edge.addColorStop(0, "rgba(0,0,0,0)");
                edge.addColorStop(1, "rgba(0,0,0,0.55)");
                ctx.fillStyle = edge;
                ellipsePath(x, y + r * 0.52, r * 0.92, r * 1.18);
                ctx.fill();
                ctx.globalAlpha = 1;

                // highlight strip
                ctx.globalAlpha = 0.14;
                ctx.fillStyle = "#fff";
                ellipsePath(x - r * 0.22, y + r * 0.18, r * 0.55, r * 0.95);
                ctx.fill();
                ctx.globalAlpha = 1;

                // stripes that "wrap" (thicker in middle, thinner near end)
                ctx.fillStyle = "#1c1c1c";
                for (let i = -1;i <= 2;i++) {
                    const yy = y + r * 0.27 + i * r * 0.39;
                    const taper = 1 - (i + 1) * 0.08; // slight taper
                    const rx = r * (0.78 * taper);
                    const ry = r * 0.16;

                    // make stripes curved by slight tilt + inner cut highlight
                    ellipsePath(x, yy, rx, ry, 0.06);
                    ctx.fill();

                    // subtle inner shine (gives wrap)
                    ctx.globalAlpha = 0.08;
                    ctx.fillStyle = "#fff";
                    ellipsePath(x - r * 0.10, yy - r * 0.02, rx * 0.65, ry * 0.55, 0.06);
                    ctx.fill();
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = "#1c1c1c";
                }

                // stinger
                ctx.fillStyle = "#121212";
                ctx.beginPath();
                ctx.moveTo(x, y + r * 1.66);
                ctx.lineTo(x - r * 0.17, y + r * 1.34);
                ctx.lineTo(x + r * 0.17, y + r * 1.34);
                ctx.closePath();
                ctx.fill();

                ctx.restore();

                // ---------- Thorax (fuzzy + warmer) ----------
                ctx.save();
                const tg = ctx.createRadialGradient(x - r * 0.18, y - r * 0.25, r * 0.1, x, y - r * 0.05, r * 1.05);
                tg.addColorStop(0, "#ffe07a");
                tg.addColorStop(1, "#d79000");

                ellipsePath(x, y - r * 0.07, r * 0.78, r * 0.70);
                ctx.fillStyle = tg;
                ctx.fill();

                // fuzzy rim: draw a few jittered strokes
                ctx.strokeStyle = "rgba(80,55,0,0.30)";
                ctx.lineWidth = Math.max(1, r * 0.06);
                for (let k = 0;k < 3;k++) {
                    const jx = (Math.random() - 0.5) * r * 0.05;
                    const jy = (Math.random() - 0.5) * r * 0.05;
                    ellipsePath(x + jx, y - r * 0.07 + jy, r * 0.78, r * 0.70);
                    ctx.stroke();
                }

                // small thorax shine
                ctx.globalAlpha = 0.10;
                ctx.fillStyle = "#fff";
                ellipsePath(x - r * 0.20, y - r * 0.25, r * 0.42, r * 0.35);
                ctx.fill();
                ctx.globalAlpha = 1;

                ctx.restore();

                // ---------- Head (eyes + antenna + tiny blush) ----------
                ctx.save();
                const hg = ctx.createRadialGradient(x - r * 0.18, y - r * 1.05, r * 0.05, x, y - r * 1.0, r * 0.95);
                hg.addColorStop(0, "#4a4a4a");
                hg.addColorStop(1, "#0d0d0d");

                ellipsePath(x, y - r * 1.02, r * 0.62, r * 0.58);
                ctx.fillStyle = hg;
                ctx.fill();

                // antennae
                ctx.strokeStyle = "#2a1a00";
                ctx.lineWidth = Math.max(1.2, r * 0.05);
                ctx.lineCap = "round";

                const ax = r * 0.20;
                ctx.beginPath();
                ctx.moveTo(x - ax, y - r * 1.35);
                ctx.quadraticCurveTo(x - r * 0.50, y - r * 1.68, x - r * 0.22, y - r * 1.88);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(x + ax, y - r * 1.35);
                ctx.quadraticCurveTo(x + r * 0.50, y - r * 1.68, x + r * 0.22, y - r * 1.88);
                ctx.stroke();

                // eyes (bigger with dark pupil + shine)
                const ex = r * 0.25, ey = y - r * 1.07;
                ctx.fillStyle = "#eaf0ff";
                ctx.beginPath(); ctx.arc(x - ex, ey, r * 0.14, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(x + ex, ey, r * 0.14, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = "rgba(0,0,0,0.35)";
                ctx.beginPath(); ctx.arc(x - ex + r * 0.03, ey + r * 0.03, r * 0.07, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(x + ex + r * 0.03, ey + r * 0.03, r * 0.07, 0, Math.PI * 2); ctx.fill();

                ctx.fillStyle = "rgba(255,255,255,0.95)";
                ctx.beginPath(); ctx.arc(x - ex - r * 0.05, ey - r * 0.06, r * 0.05, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(x + ex - r * 0.05, ey - r * 0.06, r * 0.05, 0, Math.PI * 2); ctx.fill();

                // tiny cheeks
                ctx.globalAlpha = 0.10;
                ctx.fillStyle = "#ff7aa2";
                ctx.beginPath(); ctx.arc(x - r * 0.36, y - r * 0.92, r * 0.09, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(x + r * 0.36, y - r * 0.92, r * 0.09, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1;

                // smile
                ctx.strokeStyle = "rgba(255,255,255,0.65)";
                ctx.lineWidth = Math.max(1, r * 0.035);
                ctx.beginPath();
                ctx.arc(x, y - r * 0.92, r * 0.15, 0.15 * Math.PI, 0.85 * Math.PI);
                ctx.stroke();

                ctx.restore();
            }


            function drawFlower(f) {
                const petals = 6;
                ctx.save();
                ctx.translate(f.x, f.y);
                ctx.rotate(f.rot);
                for (let i = 0;i < petals;i++) {
                    ctx.rotate((Math.PI * 2) / petals);
                    ctx.beginPath();
                    ctx.ellipse(f.r * 0.9, 0, f.r * 0.6, f.r * 0.28, 0, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,105,180,0.95)';
                    ctx.fill();
                }
                ctx.beginPath();
                ctx.arc(0, 0, f.r * 0.35, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,214,0,0.95)';
                ctx.fill();
                ctx.restore();
            }

            function drawHornet(h) {
                const x = h.x, y = h.y, r = h.r;

                // "look" direction (mostly toward bee)
                const dx = bee.x - x;
                const dy = bee.y - y;
                const ang = Math.atan2(dy, dx);

                // Near-bee danger factor
                const d = Math.sqrt(dist2(bee.x, bee.y, x, y));
                const danger = clamp(1 - d / 260, 0, 1);

                // ---- Threat aura (subtle red glow) ----
                ctx.save();
                if (danger > 0) {
                    const glow = ctx.createRadialGradient(x, y, r * 0.2, x, y, r * (2.6 + danger * 1.8));
                    glow.addColorStop(0, `rgba(255,40,40,${0.10 + danger * 0.18})`);
                    glow.addColorStop(1, "rgba(255,40,40,0)");
                    ctx.fillStyle = glow;
                    ctx.beginPath();
                    ctx.arc(x, y, r * (2.8 + danger * 2.0), 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();

                // Wing wiggle
                const wig = Math.sin(h.phase) * (0.25 + danger * 0.15);

                // ---- Wings (behind) with buzz blur ----
                ctx.save();
                const wingG = ctx.createRadialGradient(x, y - r * 0.25, r * 0.1, x, y - r * 0.25, r * 1.9);
                wingG.addColorStop(0, "rgba(240,250,255,0.75)");
                wingG.addColorStop(1, "rgba(160,210,255,0.10)");
                ctx.fillStyle = wingG;

                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.ellipse(x - r * 1.05, y - r * 0.25, r * 0.60, r * 1.15, -0.7 + wig, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(x + r * 1.05, y - r * 0.25, r * 0.60, r * 1.15, 0.7 - wig, 0, Math.PI * 2);
                ctx.fill();

                // motion blur layer
                ctx.globalAlpha = 0.22;
                ctx.beginPath();
                ctx.ellipse(x - r * 1.05, y - r * 0.25, r * 0.60, r * 1.15, -0.7 + wig * 1.7, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(x + r * 1.05, y - r * 0.25, r * 0.60, r * 1.15, 0.7 - wig * 1.7, 0, Math.PI * 2);
                ctx.fill();

                // wing veins
                ctx.globalAlpha = 0.25;
                ctx.strokeStyle = "rgba(80,120,160,0.8)";
                ctx.lineWidth = Math.max(1, r * 0.03);
                const vein = (sx, sy, ex, ey) => {
                    ctx.beginPath();
                    ctx.moveTo(sx, sy);
                    ctx.quadraticCurveTo((sx + ex) / 2, sy - r * 0.40, ex, ey);
                    ctx.stroke();
                };
                vein(x - r * 0.65, y - r * 0.65, x - r * 1.20, y + r * 0.10);
                vein(x + r * 0.65, y - r * 0.65, x + r * 1.20, y + r * 0.10);

                ctx.restore();

                // ---- Body (darker, more contrast) ----
                ctx.save();
                const bodyG = ctx.createLinearGradient(x, y - r * 1.1, x, y + r * 1.3);
                bodyG.addColorStop(0, "#ffcf3a");
                bodyG.addColorStop(0.6, "#ff9f00");
                bodyG.addColorStop(1, "#c86f00");

                ctx.beginPath();
                ctx.ellipse(x, y, r * 0.95, r * 1.25, 0, 0, Math.PI * 2);
                ctx.fillStyle = bodyG;
                ctx.fill();

                // Body edge shadow
                ctx.globalAlpha = 0.22;
                const edge = ctx.createRadialGradient(x, y, r * 0.2, x, y, r * 1.6);
                edge.addColorStop(0, "rgba(0,0,0,0)");
                edge.addColorStop(1, "rgba(0,0,0,0.55)");
                ctx.fillStyle = edge;
                ctx.beginPath();
                ctx.ellipse(x, y, r * 0.95, r * 1.25, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;

                // ---- Stripes (sharper) ----
                ctx.fillStyle = "#1a0e00";
                for (let i = -1;i <= 2;i++) {
                    const yy = y + i * r * 0.34;
                    ctx.beginPath();
                    ctx.ellipse(x, yy, r * 0.88, r * 0.13, 0.04, 0, Math.PI * 2);
                    ctx.fill();
                }

                // ---- Stinger (pointy) ----
                ctx.fillStyle = "#120a00";
                ctx.beginPath();
                ctx.moveTo(x, y + r * 1.55);
                ctx.lineTo(x - r * 0.18, y + r * 1.20);
                ctx.lineTo(x + r * 0.18, y + r * 1.20);
                ctx.closePath();
                ctx.fill();

                // ---- Legs / spikes (makes it scarier) ----
                ctx.strokeStyle = "rgba(35,18,0,0.85)";
                ctx.lineWidth = Math.max(1.2, r * 0.05);
                ctx.lineCap = "round";
                for (const side of [-1, 1]) {
                    for (let i = -1;i <= 1;i++) {
                        const ly = y - r * 0.10 + i * r * 0.32;
                        const lx = x + side * r * 0.55;
                        const kx = lx + side * r * 0.45;
                        const ky = ly + r * 0.22;
                        const fx = kx + side * r * 0.28;
                        const fy = ky + r * 0.10;

                        ctx.beginPath();
                        ctx.moveTo(lx, ly);
                        ctx.quadraticCurveTo(kx, ky, fx, fy);
                        ctx.stroke();
                    }
                }

                ctx.restore();

                // ---- Head (dark, angry face) ----
                ctx.save();
                const hx = x + Math.cos(ang) * r * 0.10; // small offset toward bee
                const hy = y - r * 1.05 + Math.sin(ang) * r * 0.06;

                const headG = ctx.createRadialGradient(hx - r * 0.10, hy - r * 0.05, r * 0.1, hx, hy, r * 0.9);
                headG.addColorStop(0, "#3a2408");
                headG.addColorStop(1, "#120700");

                ctx.beginPath();
                ctx.ellipse(hx, hy, r * 0.68, r * 0.62, 0, 0, Math.PI * 2);
                ctx.fillStyle = headG;
                ctx.fill();

                // Angry eyes + brows
                const eyeSep = r * 0.26;
                const eyeY = hy - r * 0.05;
                const eyeR = r * 0.12 + danger * r * 0.03;

                // brows
                ctx.strokeStyle = "rgba(255,60,60,0.85)";
                ctx.lineWidth = Math.max(1.2, r * 0.05);
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(hx - eyeSep - r * 0.12, eyeY - r * 0.16);
                ctx.lineTo(hx - eyeSep + r * 0.12, eyeY - r * 0.22);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(hx + eyeSep - r * 0.12, eyeY - r * 0.22);
                ctx.lineTo(hx + eyeSep + r * 0.12, eyeY - r * 0.16);
                ctx.stroke();

                // eyes (glow red)
                ctx.fillStyle = `rgba(255,60,60,${0.75 + danger * 0.20})`;
                ctx.beginPath(); ctx.arc(hx - eyeSep, eyeY, eyeR, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(hx + eyeSep, eyeY, eyeR, 0, Math.PI * 2); ctx.fill();

                // pupils
                ctx.fillStyle = "rgba(0,0,0,0.55)";
                ctx.beginPath(); ctx.arc(hx - eyeSep + r * 0.03, eyeY + r * 0.02, eyeR * 0.45, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(hx + eyeSep + r * 0.03, eyeY + r * 0.02, eyeR * 0.45, 0, Math.PI * 2); ctx.fill();

                // tiny "mouth" slash
                ctx.strokeStyle = "rgba(255,220,140,0.35)";
                ctx.lineWidth = Math.max(1, r * 0.04);
                ctx.beginPath();
                ctx.moveTo(hx - r * 0.18, hy + r * 0.22);
                ctx.lineTo(hx + r * 0.18, hy + r * 0.26);
                ctx.stroke();

                ctx.restore();
            }

            // ---------- Loop ----------
            let last = performance.now();
            function step(now) {
                const dt = Math.min(0.033, (now - last) / 1000);
                last = now;

                drawBackground(dt);

                if (running && document.visibilityState === 'visible') {
                    t += dt;
                    difficulty = Math.min(10, t / 16);
                    invuln = Math.max(0, invuln - dt);
                    // speed ramps slowly
                    speed = 260 + difficulty * 20;

                    // ---- Input to steering ----
                    // Button steering
                    let steer = 0;
                    if (holdLeft) steer -= 1;
                    if (holdRight) steer += 1;
                    if (tiltEnabled) steer += tiltX;

                    // prioritize buttons (stronger) but still allow tilt to fine tune
                    if (holdLeft || holdRight) steer = clamp(steer + tiltX * 0.35, -1, 1);
                    else steer = clamp(steer, -1, 1);

                    // ---- Physics ----
                    const maxV = 520;          // px/s
                    const response = 20;       // bigger = snappier (try 16..30)

                    const targetV = steer * maxV;
                    bee.vx += (targetV - bee.vx) * (1 - Math.exp(-response * dt));
                    bee.x += bee.vx * dt;
                    // bounds
                    bee.x = clamp(bee.x, bee.r + 10, W - bee.r - 10);

                    // ---- Spawning ----
                    // keep a steady stream of flowers and hornets
                    const targetFlowers = 4 + Math.floor(difficulty * 0.7);
                    const targetHornets = 1 + Math.floor(difficulty * 0.5);

                    if (flowers.length < targetFlowers && Math.random() < dt * (1.4 + difficulty * 0.15)) spawnFlower(false);
                    if (hornets.length < targetHornets && Math.random() < dt * (0.55 + difficulty * 0.12)) spawnHornet(false);

                    // ---- Update entities (world moves down) ----
                    for (let i = flowers.length - 1;i >= 0;i--) {
                        const f = flowers[i];
                        f.y += speed * dt;
                        f.rot += f.spin * dt;

                        // collect
                        const rr = (bee.r + f.r) * 0.8;
                        if (dist2(bee.x, bee.y, f.x, f.y) < rr * rr) {
                            flowers.splice(i, 1);
                            score++;
                            scoreEl.textContent = String(score);
                            beep(880, 0.04, 'triangle', 0.05);
                            continue;
                        }
                        if (f.y > H + 60) flowers.splice(i, 1);
                    }

                    for (let i = hornets.length - 1;i >= 0;i--) {
                        const h = hornets[i];
                        h.phase += dt * h.wiggle * 6;

                        // wiggle + drift + forward movement
                        h.y += speed * dt * 1.05;
                        h.x += (Math.sin(h.phase) * 80 + h.drift) * dt;

                        // mild homing in x
                        const home = (bee.x - h.x) * (0.35 + difficulty * 0.03);
                        h.x += home * dt;

                        // bounds for hornet
                        h.x = clamp(h.x, 20, W - 20);

                        // collision
                        const rr = (bee.r + h.r) * 0.7;
                        if (dist2(bee.x, bee.y, h.x, h.y) < rr * rr) {
                            if (invuln <= 0) {
                                hp = Math.max(0, hp - 1);
                                renderHP();

                                // i-frames
                                invuln = 1.0; // seconds of invulnerability (tweak 0.7..1.2)

                                // hit feedback
                                beep(120, 0.06, 'sawtooth', 0.06);
                                beep(90, 0.07, 'sawtooth', 0.05);

                                // optional: knock the bee a bit away from hornet
                                bee.vx += clamp((bee.x - h.x) * 6, -500, 500);

                                if (hp <= 0) {
                                    endGame();
                                    break;
                                }
                            }
                        }

                        if (h.y > H + 80) hornets.splice(i, 1);
                    }
                }

                // ---- Draw entities ----
                for (const f of flowers) drawFlower(f);
                for (const h of hornets) drawHornet(h);
                if (invuln > 0) {
                    // blink: draw only on alternating frames
                    if (Math.floor(t * 18) % 2 === 0) drawBeeTopDown();
                } else {
                    drawBeeTopDown();
                }

                requestAnimationFrame(step);
            }
            requestAnimationFrame(step);

        })();
    </script>
</body>
