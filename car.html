<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport"
        content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Car Drift Runner</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #060b16;
            overflow: hidden;
            touch-action: none
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh
        }

        .hud {
            position: fixed;
            left: 12px;
            top: 10px;
            color: #eaf0ff;
            font: 14px system-ui;
            text-shadow: 0 2px 10px rgba(0, 0, 0, .6);
            user-select: none;
            z-index: 5
        }

        .hud b {
            font-size: 18px
        }

        .controls {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            gap: 12px;
            padding: 14px;
            z-index: 6;
            user-select: none
        }

        .btn {
            flex: 1;
            height: 78px;
            border-radius: 18px;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .14);
            color: #eaf0ff;
            font: 700 20px system-ui;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .btn:active {
            background: rgba(255, 255, 255, .14)
        }

        .topBtns {
            position: fixed;
            right: 10px;
            top: 10px;
            display: flex;
            gap: 8px;
            z-index: 6;
            user-select: none
        }

        .chip {
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .12);
            color: #eaf0ff;
            font: 14px system-ui
        }

        .center {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 22px;
            z-index: 10;
            background: radial-gradient(circle at 50% 25%, rgba(0, 255, 255, .10), transparent 55%);
            color: #eaf0ff;
            font-family: system-ui;
            text-align: center;
            user-select: none
        }

        .card {
            max-width: 560px;
            background: rgba(255, 255, 255, .06);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 18px;
            padding: 18px 18px 14px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, .35)
        }

        .card h1 {
            margin: 0 0 8px;
            font-size: 22px
        }

        .card p {
            margin: 8px 0;
            opacity: .9
        }

        .hint {
            opacity: .75;
            font-size: 13px
        }

        .start {
            margin-top: 12px;
            display: inline-block;
            padding: 10px 14px;
            border-radius: 14px;
            background: rgba(0, 255, 255, .14);
            border: 1px solid rgba(0, 255, 255, .25)
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>

    <div class="hud">
        <div>Score: <b id="score">0</b></div>
        <div>Best: <span id="best">0</span></div>
        <div style="opacity:.8;margin-top:6px">Stay on the road • Curves get stronger</div>
    </div>

    <div class="topBtns">
        <div class="chip"
            id="tiltBtn">🎛️ Tilt: OFF</div>
        <div class="chip"
            id="muteBtn">🔊</div>
    </div>

    <div class="controls">
        <div class="btn"
            id="leftBtn">◀︎</div>
        <div class="btn"
            id="rightBtn">▶︎</div>
    </div>

    <div class="center"
        id="overlay">
        <div class="card">
            <h1>🏎️ Drift Runner</h1>
            <p>Hold <b>◀︎ / ▶︎</b> (or tilt) to steer. You slide a bit — drift the curves.</p>
            <p class="hint">If tilt is inverted: double-tap the Tilt button to flip it.</p>
            <div class="start">Tap to start</div>
        </div>
    </div>

    <script>
        (() => {
            // Canvas
            const canvas = document.getElementById('c');
            const ctx = canvas.getContext('2d');
            let W = 0, H = 0, DPR = 1;
            function resize() {
                DPR = Math.max(1, Math.min(2, devicePixelRatio || 1));
                W = innerWidth | 0; H = innerHeight | 0;
                canvas.width = (W * DPR) | 0; canvas.height = (H * DPR) | 0;
                ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            }
            addEventListener('resize', resize, { passive: true }); resize();

            // UI
            const overlay = document.getElementById('overlay');
            const scoreEl = document.getElementById('score');
            const bestEl = document.getElementById('best');
            const leftBtn = document.getElementById('leftBtn');
            const rightBtn = document.getElementById('rightBtn');
            const tiltBtn = document.getElementById('tiltBtn');
            const muteBtn = document.getElementById('muteBtn');

            const BEST_KEY = "drift_runner_best_v2";
            let best = +localStorage.getItem(BEST_KEY) || 0;
            bestEl.textContent = best;

            // Helpers
            const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
            const lerp = (a, b, t) => a + (b - a) * t;

            // Sound
            let audioCtx = null, muted = false;
            function beep(freq = 660, dur = 0.05, type = 'sine', vol = 0.05) {
                if (muted) return;
                try {
                    if (!audioCtx) audioCtx = new (AudioContext || webkitAudioContext)();
                    const t0 = audioCtx.currentTime;
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = type; o.frequency.setValueAtTime(freq, t0);
                    g.gain.setValueAtTime(0, t0);
                    g.gain.linearRampToValueAtTime(vol, t0 + 0.01);
                    g.gain.linearRampToValueAtTime(0, t0 + dur);
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(t0); o.stop(t0 + dur + 0.02);
                } catch (e) { }
            }
            muteBtn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                muted = !muted;
                muteBtn.textContent = muted ? "🔇" : "🔊";
                if (!muted) beep(880, 0.04, 'triangle', 0.05);
            }, { passive: false });

            // Controls (buttons + keyboard)
            let holdL = false, holdR = false;
            function bindHold(el, down, up) {
                el.addEventListener('pointerdown', (e) => { e.preventDefault(); el.setPointerCapture(e.pointerId); down(); }, { passive: false });
                el.addEventListener('pointerup', (e) => { e.preventDefault(); up(); }, { passive: false });
                el.addEventListener('pointercancel', (e) => { e.preventDefault(); up(); }, { passive: false });
            }
            bindHold(leftBtn, () => holdL = true, () => holdL = false);
            bindHold(rightBtn, () => holdR = true, () => holdR = false);
            addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft' || e.key === 'a') holdL = true; if (e.key === 'ArrowRight' || e.key === 'd') holdR = true; });
            addEventListener('keyup', (e) => { if (e.key === 'ArrowLeft' || e.key === 'a') holdL = false; if (e.key === 'ArrowRight' || e.key === 'd') holdR = false; });

            // Tilt (simple, stable)
            let tiltEnabled = false, tiltX = 0, tiltSign = 1, neutralGamma = null, lastGamma = 0;

            async function requestSensors() {
                const ask = async (Ev) => {
                    if (Ev && typeof Ev.requestPermission === 'function') {
                        const r = await Ev.requestPermission().catch(() => "denied");
                        return r === "granted";
                    }
                    return true;
                };
                return (await ask(DeviceOrientationEvent)) && (await ask(DeviceMotionEvent));
            }

            function setTilt(on) {
                tiltEnabled = on;
                tiltBtn.textContent = on ? "🎛️ Tilt: ON" : "🎛️ Tilt: OFF";
                neutralGamma = null;
                if (on) setTimeout(() => { neutralGamma = lastGamma; }, 200);
            }

            tiltBtn.addEventListener('pointerdown', async (e) => {
                e.preventDefault();
                if (!tiltEnabled) {
                    const ok = await requestSensors();
                    if (!ok) { tiltBtn.textContent = "🎛️ Tilt: BLOCKED"; beep(220, 0.06, 'sawtooth', 0.04); return; }
                    setTilt(true); beep(960, 0.05, 'triangle', 0.05);
                } else { setTilt(false); beep(440, 0.05, 'triangle', 0.05); }
            }, { passive: false });
            tiltBtn.addEventListener('dblclick', () => { tiltSign *= -1; }, { passive: true });

            addEventListener('deviceorientation', (e) => {
                if (!tiltEnabled) return;
                if (typeof e.gamma !== 'number') return;
                lastGamma = e.gamma;
                if (neutralGamma === null) return;
                const raw = (e.gamma - neutralGamma) * tiltSign;
                const dead = 3;
                const g = Math.abs(raw) < dead ? 0 : raw;
                tiltX = clamp(g / 25, -1, 1);
            }, { passive: true });

            // Game
            let running = false;
            let time = 0;
            let score = 0;

            const car = { x: 0, y: 0, vx: 0, w: 34, h: 58, slip: 0 };
            let speed = 420;                 // forward scroll
            let roadHalf = 0;                // half width in px
            let curveStrength = 0.0;         // ramps up
            const skids = [];                // {x1,y1,x2,y2,life}

            function reset() {
                time = 0; score = 0;
                speed = 420;
                roadHalf = Math.max(120, Math.min(170, W * 0.25));
                curveStrength = 0.0;

                car.x = W * 0.5;
                car.y = H * 0.72;
                car.vx = 0;
                car.slip = 0;

                skids.length = 0;
                scoreEl.textContent = "0";
            }

            function start() {
                overlay.style.display = 'none';
                running = true;
                reset();
                beep(660, 0.05, 'sine', 0.06);
            }
            function end() {
                running = false;
                overlay.style.display = 'flex';
                const s = Math.floor(score);
                if (s > best) { best = s; localStorage.setItem(BEST_KEY, String(best)); bestEl.textContent = best; }
                beep(180, 0.10, 'sawtooth', 0.05); beep(120, 0.12, 'sawtooth', 0.05);
            }

            overlay.addEventListener('pointerdown', (e) => { e.preventDefault(); start(); }, { passive: false });
            canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); if (!running) start(); }, { passive: false });

            // Road centerline: smooth, deterministic curves (no unstable feedback)
            function roadCenter(y, t) {
                // perspective: more curve far away, less near car
                const p = 1 - (y / H);
                const amp = (W * 0.18) * curveStrength * (0.35 + 0.85 * p);

                // sum of sines -> nice twisty road
                const c =
                    Math.sin(t * 0.8) * amp +
                    Math.sin(t * 1.55 + 1.3) * (amp * 0.55) +
                    Math.sin(t * 2.2 + 0.2) * (amp * 0.35);

                return W * 0.5 + c;
            }

            // Drawing
            function bg(dt) {
                const g = ctx.createLinearGradient(0, 0, 0, H);
                g.addColorStop(0, '#060b16');
                g.addColorStop(1, '#040711');
                ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

                // little moving specks (speed feeling)
                ctx.globalAlpha = 0.12;
                for (let i = 0;i < 50;i++) {
                    const x = (i * 97 + time * 200) % W;
                    const y = (i * 41 + time * 520) % H;
                    ctx.fillStyle = '#eaf0ff';
                    ctx.fillRect(x, y, 2, 2);
                }
                ctx.globalAlpha = 1;
            }

            function drawRoad() {
                const strips = 42;
                const stripH = H / strips;
                for (let i = 0;i < strips;i++) {
                    const y0 = i * stripH;
                    const yMid = y0 + stripH * 0.5;
                    const p = i / (strips - 1);
                    const widen = lerp(0.75, 1.28, p);
                    const half = roadHalf * widen;

                    const c = roadCenter(yMid, time);

                    // asphalt
                    ctx.fillStyle = '#101625';
                    ctx.fillRect(c - half, y0, half * 2, stripH + 2);

                    // edges
                    ctx.globalAlpha = 0.7;
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(c - half - 3, y0, 3, stripH + 2);
                    ctx.fillRect(c + half, y0, 3, stripH + 2);
                    ctx.globalAlpha = 1;

                    // center dashed line
                    ctx.globalAlpha = 0.35;
                    const dash = ((time * speed * 0.04 + y0) % 70);
                    if (dash < 35) ctx.fillRect(c - 2, y0, 4, stripH + 2);
                    ctx.globalAlpha = 1;
                }
            }

            function drawSkids(dt) {
                ctx.globalAlpha = 0.35;
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                for (let i = skids.length - 1;i >= 0;i--) {
                    const s = skids[i];
                    s.life -= dt;
                    ctx.globalAlpha = 0.35 * Math.max(0, s.life / 0.6);
                    ctx.beginPath(); ctx.moveTo(s.x1, s.y1); ctx.lineTo(s.x2, s.y2); ctx.stroke();
                    if (s.life <= 0) skids.splice(i, 1);
                }
                ctx.globalAlpha = 1;
            }

            // roundRect polyfill
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                    r = Math.min(r, w / 2, h / 2);
                    this.beginPath();
                    this.moveTo(x + r, y);
                    this.arcTo(x + w, y, x + w, y + h, r);
                    this.arcTo(x + w, y + h, x, y + h, r);
                    this.arcTo(x, y + h, x, y, r);
                    this.arcTo(x, y, x + w, y, r);
                    this.closePath();
                    return this;
                };
            }

            function drawCar() {
                ctx.save();
                ctx.translate(car.x, car.y);

                // visual slip angle (drift feel)
                const ang = clamp(car.slip * 0.65, -0.55, 0.55);
                ctx.rotate(ang);

                // body
                ctx.fillStyle = '#00e5ff';
                ctx.roundRect(-car.w / 2, -car.h / 2, car.w, car.h, 10);
                ctx.fill();

                // windshield
                ctx.globalAlpha = 0.22;
                ctx.fillStyle = '#cfe8ff';
                ctx.roundRect(-car.w * 0.28, -car.h * 0.22, car.w * 0.56, car.h * 0.38, 8);
                ctx.fill();
                ctx.globalAlpha = 1;

                // wheels
                ctx.fillStyle = '#111';
                const ww = car.w * 0.22, wh = car.h * 0.18;
                ctx.fillRect(-car.w * 0.56, -car.h * 0.28, ww, wh);
                ctx.fillRect(car.w * 0.34, -car.h * 0.28, ww, wh);
                ctx.fillRect(-car.w * 0.56, car.h * 0.10, ww, wh);
                ctx.fillRect(car.w * 0.34, car.h * 0.10, ww, wh);

                // headlights
                ctx.globalAlpha = 0.6;
                ctx.fillStyle = '#eaf0ff';
                ctx.fillRect(-car.w * 0.30, -car.h * 0.52, car.w * 0.25, 5);
                ctx.fillRect(car.w * 0.05, -car.h * 0.52, car.w * 0.25, 5);
                ctx.globalAlpha = 1;

                ctx.restore();
            }

            // Loop
            let last = performance.now();
            function loop(now) {
                const dt = Math.min(0.033, (now - last) / 1000);
                last = now;

                // time always moves (nice menu)
                time += dt;

                bg(dt);
                drawRoad();

                if (running && document.visibilityState === 'visible') {
                    // ramp difficulty smoothly
                    curveStrength = clamp(curveStrength + dt * 0.06, 0, 1);
                    speed = clamp(speed + dt * 6, 420, 820);

                    // input
                    let steer = 0;
                    if (holdL) steer -= 1;
                    if (holdR) steer += 1;
                    if (tiltEnabled) steer += tiltX;
                    steer = clamp(steer, -1, 1);

                    // physics (stable!)
                    const accel = 1600;      // steering response
                    const drag = 7.5;       // how fast slide settles (higher = less drift)
                    car.vx += steer * accel * dt;
                    car.vx -= car.vx * drag * dt;
                    car.x += car.vx * dt;

                    // drift visual
                    car.slip = lerp(car.slip, clamp(car.vx / 520, -1, 1), 1 - Math.exp(-dt * 10));

                    // skid marks
                    if (Math.abs(car.slip) > 0.5 && Math.random() < dt * 14) {
                        skids.push({
                            x1: car.x - 8, y1: car.y + 18,
                            x2: car.x - 10 - car.slip * 12, y2: car.y + 42,
                            life: 0.6
                        });
                        skids.push({
                            x1: car.x + 8, y1: car.y + 18,
                            x2: car.x + 10 - car.slip * 12, y2: car.y + 42,
                            life: 0.6
                        });
                    }

                    // road bounds at car position
                    const c = roadCenter(car.y, time);
                    const half = roadHalf * 1.15;
                    const left = c - half + 16;
                    const right = c + half - 16;

                    // crash if out of road (simple + predictable)
                    if (car.x < left || car.x > right) {
                        end();
                    }

                    // score by distance
                    score += dt * (speed / 85);
                    scoreEl.textContent = String(Math.floor(score));
                }

                drawSkids(dt);
                drawCar();

                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        })();
    </script>
</body>

</html>
